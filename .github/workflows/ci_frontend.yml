name: CI Frontend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  format_check_frontend:
    name: Format check (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  frontend_test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Run tests
        run: npm run test:run

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: [format_check_frontend, frontend_test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_pages.yml

  docker_build_push_frontend:
    name: Build and push frontend Docker image for master and develop
    runs-on: ubuntu-latest
    needs: [format_check_frontend, frontend_test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write # Sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch tags for the version indicator

      - name: Determine git tag
        id: git_tag
        run: echo "tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auto_apms_studio_web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false # Attested by a separate step, avoids an "unknown/unknown" manifest in the registry
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTO_APMS_STUDIO_GIT_SHA=${{ github.sha }}
            AUTO_APMS_STUDIO_GIT_TAG=${{ steps.git_tag.outputs.tag }}
            AUTO_APMS_STUDIO_REPO_URL=${{ github.server_url }}/${{ github.repository }}

      # Signed provenance, verifiable with: gh attestation verify oci://<image>:<tag> --owner AutoAPMS
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
